<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Content Studio</title><link rel="stylesheet" href="styles.css"></head><body><main><header><p class="eyebrow">GEMINI-POWERED WORKSPACE</p><h1>AI Content Studio</h1><p>Turn one idea into publish-ready writing, visuals, and narration.</p></header><div id="status" role="status"></div><section class="card"><h2>Start a project</h2><form id="generateForm"><label>Topic<input id="topic" required maxlength="500" placeholder="e.g. How urban gardens improve wellbeing"></label><label>Target audience<input id="audience" required maxlength="500" placeholder="e.g. busy university students"></label><label>Writing tone<input id="tone" required maxlength="100" value="clear and encouraging"></label><button>Generate content</button></form></section><section id="results" class="hidden"><div class="grid"><article class="card"><h2 id="title"></h2><div id="article" class="article"></div></article><aside class="card"><h2>Summary</h2><p id="summary"></p><h2>Social posts</h2><div id="social"></div></aside></div><div class="grid"><section class="card"><h2>Thumbnail</h2><textarea id="imagePrompt" rows="5"></textarea><button id="imageBtn">Generate image</button><img id="thumbnail" class="preview hidden" alt="Generated thumbnail"></section><section class="card"><h2>Narration</h2><textarea id="narration" rows="8"></textarea><div class="controls"><select id="voice"><option>Kore</option><option>Puck</option><option>Aoede</option><option>Charon</option></select><select id="style"><option>professional</option><option>calm and relaxed</option><option>energetic and enthusiastic</option><option>warm and friendly</option></select><button id="audioBtn">Create audio</button></div><audio id="audio" controls class="hidden"></audio></section></div><a class="button" href="/api/export">Download ZIP export</a></section></main><script src="app.js"></script></body></html>
